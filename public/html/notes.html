<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>

<body>
    <div class="container mt-4">
        <h2 id="userGreeting">Welcome</h2>
        <p id="userRole">Role: </p>

        <!-- Note Form -->
        <div class="mb-4">
            <h4>Add New Note</h4>
            <form id="noteForm">
                <input type="hidden" id="noteId" />
                <div class="mb-2">
                    <input type="text" class="form-control" id="title" placeholder="Note Title" required />
                </div>
                <div class="mb-2">
                    <textarea class="form-control" id="content" placeholder="Note Content" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Note</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </form>
        </div>

        <!-- Notes List -->
        <h4>Your Notes</h4>
        <ul class="list-group" id="notesList"></ul>

        <!-- Logout -->
        <button class="btn btn-danger mt-3" id="logout">Logout</button>
    </div>

    <script src="../js/notes.js"></script>
</body>

</html>
